name: build

# CI compiles the Core assembly only. The Plugin assembly references
# Unbroken.LaunchBox.Plugins.dll which ships only with a local LaunchBox install
# and is not redistributable, so the full plugin .zip can only be built locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore (Core only)
        run: dotnet restore src/Core/Core.csproj

      - name: Build (Core only)
        run: dotnet build src/Core/Core.csproj -c Release --no-restore -v minimal
