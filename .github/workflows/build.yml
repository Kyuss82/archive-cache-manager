name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # required to attach assets to a release on tag pushes

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/ArchiveCacheManager.sln

      - name: Build
        run: dotnet build src/ArchiveCacheManager.sln -c Release --no-restore -v minimal

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveCacheManager
          path: release/ArchiveCacheManager.zip
          if-no-files-found: error

      - name: Attach to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/ArchiveCacheManager.zip
          generate_release_notes: true
